stages:
  - build

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  IMAGE_REF: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

build-frontend-container:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    # Attempt to pull existing image for Docker layer caching
    - docker pull $IMAGE_REF || docker pull $IMAGE_LATEST || true
    # Build container image with caching
    - >
      docker build
      --cache-from $IMAGE_REF
      --cache-from $IMAGE_LATEST
      -t $IMAGE_TAG
      -t $IMAGE_REF
      .
    # If on the default branch (e.g. main/master), tag and push 'latest'
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag $IMAGE_TAG $IMAGE_LATEST
        docker push $IMAGE_LATEST
      fi
    # Push image tagged with commit SHA and branch slug
    - docker push $IMAGE_TAG
    - docker push $IMAGE_REF
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
