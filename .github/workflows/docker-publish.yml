name: Build and Push Frontend Docker Image to Docker Hub

on:
  push:
    branches:
      - develop
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: fawaswebcastle/southurban-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # Docker Hub Login
      # --------------------------------------------------
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------
      # Docker Image Metadata
      # --------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

          tags: |
            # Production
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

            # Development
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

            # Git branch
            type=ref,event=branch

            # Pull request
            type=ref,event=pr

            # Semantic version
            type=semver,pattern={{version}}

            # Git SHA
            type=sha,format=short

          labels: |
            org.opencontainers.image.title=South Urban Frontend
            org.opencontainers.image.description=South Urban Frontend Application
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # --------------------------------------------------
      # Build & Push Docker Image
      # --------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          # Current deployment architecture
          platforms: linux/amd64

          push: ${{ github.event_name != 'pull_request' }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------
      # Trigger Coolify Deployment
      # --------------------------------------------------
      - name: Trigger Coolify Deployment
        if: github.event_name != 'pull_request'
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          echo "Triggering Coolify deployment..."

          curl --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -X GET "$COOLIFY_WEBHOOK_URL"

          echo "Coolify deployment triggered successfully."
